[package]
name = "pfloat"
version = "0.1.0"
edition = "2021"
# No `rust-version`: pfloat requires nightly Rust for
# `feature(generic_const_exprs)` per ADR-0011. The toolchain is pinned
# in `rust-toolchain.toml` and bumped deliberately.
license = "MIT OR Apache-2.0"
repository = "https://github.com/ixmatus/pfloat"
description = "Pure Rust correctly-rounded arbitrary-precision floats."
keywords = ["float", "ieee754", "arbitrary-precision", "no_std", "mpfr"]
categories = ["mathematics", "no-std", "no-std::no-alloc"]

[features]
# Defaults match the std + dynamic-precision profile most callers
# expect from an MPFR replacement. Embedded users opt out via
# `default-features = false` and pick `fixed` (const-generic
# `FixedFloat<PREC>`) for an alloc-free build.
default = ["std", "fmt", "big"]

# Standard library: pulls in alloc, plus thread-local sticky exception
# flags and `std::error::Error` impls.
std = ["alloc"]

# Heap-allocated multi-limb buffers for `BigFloat`.
alloc = []

# `core::fmt::Write`-based parse and format.
fmt = []

# Dynamic-precision `BigFloat`. Requires `alloc`.
big = ["alloc"]

# Const-generic `FixedFloat<const PREC: u32>`. Stack-allocated.
#
# Slice 1g implements the arithmetic by delegating to BigFloat via
# heap-allocated conversion, so `fixed` currently implies `big` (and
# transitively `alloc`). A future slice can extract the kernels to
# work directly on `[u64; N]` storage and lift this dependency.
fixed = ["big"]

# `core::ops::Add` / `Sub` / `Mul` / `Div` / `Neg` overloads and
# their `*Assign` variants for BigFloat and FixedFloat<PREC>. Opt-in
# because the overloads use `RoundingMode::NearestEven` by default
# and discard the Status return. Callers wanting explicit rounding
# mode or flag accumulation continue to use the method form.
ops = ["big"]

# Elementary transcendentals: exp, expm1, exp2, exp10, ln, log1p,
# log2, log10. Slice 3a ships `exp`; subsequent slices fill in the
# rest. Implies `big` and `agm`: slice 7b uses AGM-based on-the-fly
# computation of `π` and `ln(2)` to lift the 1024-bit hardcoded
# constant ceiling that previously capped transcendental working
# precision (ADR-0017).
exp-log = ["big", "agm"]

# Trig cluster: forward and inverse circular trigonometric functions
# (sin, cos, tan, asin, acos, atan, atan2). Slice 3f ships the
# forward trio with Payne-Hanek-style argument reduction against a
# hardcoded 4096-bit table of 2/π. Inverse trig lands in a follow-up
# slice. Implies `exp-log` because the reduction reuses ln(2)-style
# hardcoded constants and the Taylor series share infrastructure
# with the exp/ln kernels.
trig = ["exp-log"]

# Tier-1 special functions: erf, erfc, gamma, lgamma, digamma, beta.
# Slice 4a ships the erf family; the gamma family follows in 4b/4c.
# Implies `trig` because the gamma reflection formula
# Γ(x)·Γ(1−x) = π / sin(πx) routes through `sin` for the
# negative-x branch. (And `trig` implies `exp-log`.)
specials = ["trig"]

# Arithmetic-geometric mean. Pure arithmetic primitive (uses only
# add, sub, mul, div, sqrt from Phase 1), independent of the
# transcendental cluster. ADR-0015 records the feature-gating
# rationale. Slice 7b will widen `exp-log` to depend on `agm`
# when on-the-fly transcendental constants land; until then, AGM
# is genuinely standalone.
agm = ["big"]

# Integral special functions: Ei (exponential integral), Si (sine
# integral), Ci (cosine integral), li (logarithmic integral). Slice
# 6m. Implies `specials`: the kernels reuse the erf-style asymptotic
# dispatch, the `auto_raise` flag pipeline, and the working-precision
# convention, and Ei/Ci/li need the Euler-Mascheroni constant landed
# in slice 6m0. ADR-0019 records the design.
integrals = ["specials"]

# Airy functions Ai, Bi and their derivatives Ai′, Bi′. Slice 6n.
# Implies `specials`: the kernel reuses the erf/si asymptotic-plus-
# Taylor dispatch, the `auto_raise` flag pipeline, the
# working-precision convention, and composes the boundary constants
# from the in-crate `gamma` kernel. Airy is a tier-2 special
# function, not an integral, so it depends on `specials` directly
# rather than on `integrals`. ADR-0021 records the design.
airy = ["specials"]

# Bessel functions of the first kind J0, J1, Jn (ordinary, integer
# order, real argument). Tier-2 special; depends on `specials` for
# the in-crate transcendental constants. ADR-0023 records the
# Miller-recurrence design. Slice 6o.
bessel = ["specials"]

# Riemann zeta function ζ(s) for real argument (DLMF Chapter 25).
# Tier-2 special; depends on `specials` for the in-crate
# transcendental constants (π, the Bernoulli table reused from
# `gamma_stirling`) and, for the negative-axis functional equation
# DLMF 25.4.2, the in-crate `sin`, `pow`, and `Γ` kernels. zeta is a
# distinct family (no order parameter, no recurrence machinery), so
# it gets its own cluster feature rather than folding under
# `specials` (the bessel/integrals/airy precedent). ADR-0026 records
# the design and the DLMF provenance. Slice 6r.
zeta = ["specials"]

# Compile Kani proof harnesses. Off in normal builds.
kani = []

# Differential testing against MPFR via `rug` (a safe wrapper over
# `gmp-mpfr-sys`). ADR-0014 records the choice; ADR-0008 documents
# the broader oracle policy. The feature gates the differential test
# files via `required-features` below — cargo does not allow
# dev-dependencies to be `optional`, so the `rug` build itself runs
# unconditionally on Unix. Implies `specials` so every math op the
# differential tests call (ln, sinh, gamma, ...) is available, plus
# `agm` since slice 6l's `differential_agm.rs` calls `BigFloat::agm`,
# and `integrals` for slice 6m's `differential_{ei,si,ci,li}.rs`.
differential-mpfr = ["std", "fmt", "big", "specials", "agm", "integrals", "airy", "bessel", "zeta"]

[dev-dependencies]
# Property-based testing for the integration suite under `tests/`.
proptest = { version = "1", default-features = false, features = ["std"] }

# Criterion drives the slice 7d Karatsuba-threshold calibration bench
# (`benches/mul_thresholds.rs`). Dev-only: it is not in the shipped
# dependency graph, so the permacomputing-horizon / no_std posture is
# unaffected. `default-features = false` drops the `plotters`/`rayon`
# HTML-report tree (ADR-0027); `cargo_bench_support` is the minimum
# needed to run under `cargo bench`.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# `rug` is the safe high-level wrapper over `gmp-mpfr-sys`. Unix-only
# per ADR-0014; Windows differential coverage is not available
# because gmp-mpfr-sys does not build on stock Windows toolchains.
[target.'cfg(unix)'.dev-dependencies]
rug = { version = "1", default-features = false, features = ["float", "integer"] }

# Differential tests only build when the `differential-mpfr` feature
# is active. Without the feature flag, `cargo test` skips them, and
# the test binaries do not link against `rug`.
[[test]]
name = "differential_add"
path = "tests/differential_add.rs"
required-features = ["differential-mpfr"]

