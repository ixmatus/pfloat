[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we explicitly allow. Two categories:
#
# 1. Cast lints — multi-precision arithmetic does width-shrinking and
#    sign-changing casts deliberately, with bounds maintained by the
#    surrounding logic. Letting clippy fight them adds noise.
# 2. Style lints that disagree with the kernel's needs:
#    - `match_same_arms` for IEEE classification dispatches that
#      deliberately enumerate every Class variant for clarity.
#    - `similar_names` flags `lo` vs. `lo_lo`, `mid` vs. `mid_lo` etc.
#      in the multi-limb arithmetic; those names are precise.
#    - `float_cmp` — sometimes the right test (e.g. checking f64 == 0.0
#      to detect underflow exactly).
#    - `unreadable_literal` — some constants are clearer without
#      digit-separator clutter (e.g. bit masks, magic exponents).
#    - The various "too many" / "single char" counts — math kernels
#      legitimately have wide operand surfaces and short symbolic names.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
match_same_arms = "allow"
similar_names = "allow"
float_cmp = "allow"
single_match_else = "allow"
unreadable_literal = "allow"
items_after_statements = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
assertions_on_constants = "allow"
trivially_copy_pass_by_ref = "allow"
fn_params_excessive_bools = "allow"
should_implement_trait = "allow"
manual_let_else = "allow"
enum_variant_names = "allow"
missing_panics_doc = "allow"

# Slice 7d: Karatsuba/Toom-Cook threshold calibration bench. Uses
# criterion's own harness (`harness = false`); not run by `cargo test`,
# so the lib-test bucket is unchanged.
[[bench]]
name = "mul_thresholds"
harness = false

# Sub-slice 2b.1: Spouge precision-pegging baseline / regression
# bench. Sub-slice 2b.1 attempted to tighten `spouge_a_for`'s safety
# margin from ~700 bits to ~50 bits but the change broke the
# differential_zeta verification at p=1024 (the FE-branch composition
# loses more bits than the bound predicted). The implementation
# change reverted per ADR-0041 (rejected); the bench stays in tree
# as the measurement infrastructure for the post-v1.0 empirical
# investigation. `harness = false` per the same pattern;
# `required-features = ["specials"]` because lgamma lives there.
[[bench]]
name = "spouge_lgamma"
harness = false
required-features = ["specials"]

# Sub-slice 2b.2.a: Bessel asymptotic-vs-Miller dispatch bench. All
# four Bessel kernels (J / Y / I / K) share `bessel_j_threshold`
# (`src/math/bessel_j.rs:455-464`); the cells straddle the current
# cut at `precision ∈ {256, 1024}`. Save baseline with `--
# --save-baseline phase2b-bessel-baseline`; re-run with `--baseline
# phase2b-bessel-baseline` after tightening to diff.
[[bench]]
name = "bessel_dispatch"
harness = false
required-features = ["bessel"]

# Sub-slice 2b.2.b: Airy asymptotic-vs-Maclaurin dispatch bench.
# The threshold (`airy_threshold_exponent` at
# `src/math/airy.rs:392-406`) is already ~1.5% over the strict
# accuracy bound (the cube-of-|x|³ growth makes it sticky); 2b.2.b
# closed documentation-tier per ADR-0044. Bench lands as durable
# measurement infrastructure for any future Airy work
# (airy_asymptotic_pos/neg boost reduction, boundary-constant
# memoisation, etc.).
[[bench]]
name = "airy_dispatch"
harness = false
required-features = ["airy"]

[[bench]]
name = "small_arg"
harness = false
required-features = ["trig"]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = false

[profile.bench]
lto = "thin"
codegen-units = 1
