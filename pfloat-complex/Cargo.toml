[package]
name = "pfloat-complex"
version = "1.0.0"
edition = "2021"
# No `rust-version`: pfloat-complex builds pfloat, which requires nightly
# Rust for `feature(generic_const_exprs)` (pfloat ADR-0011). The workspace
# `rust-toolchain.toml` pins the channel.
license = "MIT OR Apache-2.0"
repository = "https://github.com/ixmatus/pfloat"
description = "Componentwise correctly-rounded complex arithmetic in pure Rust, built on pfloat"
authors = ["Parnell Springmeyer <parnell@digitalmentat.com>"]
keywords = ["complex", "arbitrary-precision", "correctly-rounded", "no_std", "mpc"]
categories = ["mathematics", "no-std", "science"]
readme = "README.md"

[features]
# `Complex<BigFloat>` is the headline dynamic-precision type and needs
# `alloc` exactly as `BigFloat` does, so the default profile carries
# `std` + `big`.
default = ["std", "big"]

# Standard library: pfloat's thread-local sticky flags + std error impls.
std = ["alloc", "pfloat/std"]

# Heap-allocated multi-limb buffers (required by `BigFloat`).
alloc = ["pfloat/alloc"]

# `Complex<BigFloat>`: dynamic-precision complex. Requires `alloc`.
big = ["alloc", "pfloat/big"]

# `Complex<FixedFloat<PREC>>`: compile-time-precision complex. Pulls `big`
# because pfloat's `fixed` delegates through `big` today.
fixed = ["big", "pfloat/fixed"]

# Elementary-function pass-through gates (C4), mirroring pfloat and
# pfloat-ball. Each enables the matching pfloat kernel family so the complex
# magnitude/phase and elementary core have a correctly-rounded scalar kernel
# to compose: `exp-log` covers `hypot`/`exp`/`ln`/`log1p` (and `sqrt` is
# core); `trig` adds `atan2`/`sin`/`cos`. Opt-in: a minimal
# `Complex<FixedFloat<PREC>>` keeps add/sub/mul/div without pulling the
# transcendental surface.
exp-log = ["big", "pfloat/exp-log"]
trig = ["exp-log", "pfloat/trig"]

# The independent complex-Arb (`acb`) componentwise certified-rounding backstop
# (per-release lane, C5 / ADR-0092). Reaches Arb purely through a python-flint
# `acb` subprocess worker (out of process), so it pulls NO `rug`/gmp-mpfr-sys --
# FLINT/Arb (LGPL) never enter the link graph at rest or under test. It gates
# the subprocess driver + dyadic codec in `tests/common/acb_bracket.rs` and the
# `differential_acb` test; `trig` gives it the full elementary surface to pin.
differential-acb = ["std", "trig"]

[dependencies]
# pfloat is the verified scalar engine the components are. Default-features
# off; this crate forwards the exact pfloat features it needs, mirroring the
# pfloat-libm and pfloat-ball members.
pfloat = { path = "..", default-features = false }

# The enumerated Annex G tables, the dispatch-totality enumeration, and the
# algebraic identities exercise the elementary surface, so they build only
# when `trig` is on (the `#![cfg(feature = "trig")]` file guard makes them
# empty otherwise; the required-features stanza skips the target entirely so
# `--no-default-features` never compiles them).
[[test]]
name = "annex_g_special_values"
required-features = ["trig"]

[[test]]
name = "dispatch_totality"
required-features = ["trig"]

[[test]]
name = "identities"
required-features = ["trig"]

# The independent acb componentwise certified-rounding lane (per-release; needs
# the worker venv via scripts/setup_arb_oracle.sh).
[[test]]
name = "differential_acb"
required-features = ["differential-acb"]

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, not by Cargo; declare it so
# the unexpected-cfgs lint stays quiet under -D warnings.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
