name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # pfloat requires nightly Rust per ADR-0011 (generic_const_exprs).
  # The pin matches `rust-toolchain.toml`; bumps are deliberate.
  PFLOAT_NIGHTLY: nightly-2026-05-10

jobs:
  # ---------- Test matrix on Linux + macOS, default + feature combos ----------
  # The matrix exercises the non-MPFR feature surface. The `differential-mpfr`
  # feature has its own dedicated Linux job below so the test matrix can
  # stay free of the gmp-mpfr-sys system dependency.
  test:
    name: test (${{ matrix.os }} / ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features:
          - ""                                # default features (std, fmt, big)
          - "--no-default-features"           # bare lib
          - "--no-default-features --features=alloc,big"
          - "--no-default-features --features=fixed"
          - "--no-default-features --features=ops,big"
          - "--features=std,fmt,big,fixed,ops,exp-log,trig,specials"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PFLOAT_NIGHTLY }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build ${{ matrix.features }} --verbose
      - run: cargo test ${{ matrix.features }} --verbose

  # ---------- Cross-compile to thumbv6m (Cortex-M0+ floor) ----------
  thumbv6m:
    name: cross-compile (thumbv6m-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PFLOAT_NIGHTLY }}
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --verbose
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --features=alloc,big --verbose
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --features=fixed --verbose

  # ---------- Format / lint ----------
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PFLOAT_NIGHTLY }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PFLOAT_NIGHTLY }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --features=std,fmt,big,fixed,ops,exp-log,trig,specials --all-targets -- -D warnings

  # ---------- Kani proof harnesses (advisory, non-blocking) ----------
  # Phase 6 lands the harness layout in slice 6a. ADR-0012 records
  # the decision to gate this lane as advisory (`continue-on-error`)
  # rather than blocking: ferrodec's experience (memory:
  # `feedback_kani_ci_timeout_ok.md`) is that Kani's GitHub Actions
  # runs time out reliably on transcendental-heavy surfaces. Failures
  # surface in PR status; they do not block merge.
  kani:
    name: kani harnesses (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PFLOAT_NIGHTLY }}
      # The `kani-github-action` runs `cargo-kani ${args}` itself
      # during its `Run Kani` composite step. Features must be
      # passed via the `args` input — a follow-up `- run: cargo kani`
      # step never fires because the action already failed by then.
      # `specials` transitively pulls in trig + exp-log; fixed + ops
      # cover the const-generic and operator-overload paths.
      # `differential-mpfr` is omitted (would pull in the MPFR
      # system dependency).
      - uses: model-checking/kani-github-action@v1.1
        with:
          args: --features=std,fmt,big,fixed,ops,exp-log,trig,specials

  # ---------- libFuzzer smoke ----------
  # ADR-0013 records the layout. Each target gets a 60-second smoke
  # run; deep coverage runs locally on demand. Slice 6a ships the
  # `parse` target only; slices 6b–6f add `arith`, `exp_log_family`,
  # `trig`, `hyperbolic`, `specials`, `total_cmp`, and `fmt`.
  fuzz-smoke:
    name: fuzz smoke (60s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PFLOAT_NIGHTLY }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz
      - working-directory: fuzz
        run: cargo fuzz build
      - working-directory: fuzz
        run: cargo fuzz run parse -- -max_total_time=60

  # ---------- MPFR differential (Linux-only) ----------
  # ADR-0014 records the gating: 10⁴ inputs / (op × precision × mode)
  # in CI, 10⁶ locally under `PFLOAT_DEEP=1`. The lane is Linux-only
  # because `gmp-mpfr-sys` does not build on stock Windows toolchains;
  # `rug` (the safe wrapper) is gated `cfg(unix)` in `Cargo.toml`.
  differential:
    name: MPFR differential (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PFLOAT_NIGHTLY }}
      - uses: Swatinem/rust-cache@v2
      - name: Install MPFR + GMP
        run: sudo apt-get update && sudo apt-get install -y libmpfr-dev libgmp-dev
      - run: cargo test --features=differential-mpfr --test 'differential_*' --verbose
