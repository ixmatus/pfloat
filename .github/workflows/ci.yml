name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # pfloat requires nightly Rust per ADR-0011 (generic_const_exprs).
  # The pin matches `rust-toolchain.toml`; bumps are deliberate.
  PFLOAT_NIGHTLY: nightly-2026-05-10

jobs:
  # ---------- Test matrix on Linux + macOS, default + feature combos ----------
  # The matrix exercises the non-MPFR feature surface. The `differential-mpfr`
  # feature has its own dedicated Linux job below so the test matrix can
  # stay free of the gmp-mpfr-sys system dependency.
  test:
    name: test (${{ matrix.os }} / ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features:
          - ""                                # default features (std, fmt, big)
          - "--no-default-features"           # bare lib
          - "--no-default-features --features=alloc,big"
          - "--no-default-features --features=fixed"
          - "--no-default-features --features=ops,big"
          - "--no-default-features --features=big,agm"
          - "--features=std,fmt,big,fixed,ops,exp-log,trig,specials,agm,integrals,airy,bessel,zeta,serde,num-traits"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PFLOAT_NIGHTLY }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build ${{ matrix.features }} --verbose
      - run: cargo test ${{ matrix.features }} --verbose

  # ---------- Cross-compile to thumbv6m (Cortex-M0+ floor) ----------
  thumbv6m:
    name: cross-compile (thumbv6m-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PFLOAT_NIGHTLY }}
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --verbose
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --features=alloc,big --verbose
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --features=fixed --verbose

  # ---------- Format / lint ----------
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PFLOAT_NIGHTLY }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PFLOAT_NIGHTLY }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --features=std,fmt,big,fixed,ops,exp-log,trig,specials,agm,integrals,airy,bessel,zeta,serde,num-traits --all-targets -- -D warnings

  # ---------- pfloat-libm member: shell + MPFR verification harness ----------
  # The root test matrix scopes to the `pfloat` package (default-members
  # = ["."]), so the `pfloat-libm` member has no other lane. This job
  # builds it, lints both feature configurations, and runs the shell's
  # unit tests plus the MPFR harness (smoke gate + f64 differential +
  # Lefevre-Muller lanes) in one `--release` test run. Linux-only and
  # MPFR-gated, like the pfloat `differential` job below: `rug`
  # (gmp-mpfr-sys) does not build on stock Windows/macOS runners. The
  # exhaustive 2^32 sweep is the EC2 deliverable (ADR-0058), not a
  # per-push job. `--release` keeps the harness lanes at the seconds
  # scale; a debug run is an order of magnitude slower.
  pfloat-libm:
    name: pfloat-libm (shell + MPFR harness)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PFLOAT_NIGHTLY }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install MPFR + GMP
        run: sudo apt-get update && sudo apt-get install -y libmpfr-dev libgmp-dev
      - run: cargo build -p pfloat-libm --verbose
      - run: cargo clippy -p pfloat-libm --all-targets -- -D warnings
      - run: cargo clippy -p pfloat-libm --all-targets --features=differential-mpfr -- -D warnings
      - run: cargo test -p pfloat-libm --release --features=differential-mpfr --verbose

  # Kani harnesses moved to a manual `workflow_dispatch` trigger
  # in `.github/workflows/kani.yml` per slice 6k. ADR-0012's status
  # update records the shift: every-push runs were costly (~10
  # minutes) without delivering useful evidence (proofs time out
  # before completing on the transcendental-heavy surface). The
  # harnesses still live in `src/verify/`; run them on demand from
  # the Actions tab when you want a verification pass.

  # ---------- libFuzzer smoke ----------
  # ADR-0013 records the layout. Each target gets a 60-second smoke
  # run; deep coverage runs locally on demand. Slice 6a ships the
  # `parse` target only; slices 6b–6f add `arith`, `exp_log_family`,
  # `trig`, `hyperbolic`, `specials`, `total_cmp`, and `fmt`.
  fuzz-smoke:
    name: fuzz smoke (60s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PFLOAT_NIGHTLY }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz
      - working-directory: fuzz
        run: cargo fuzz build
      - working-directory: fuzz
        run: cargo fuzz run parse -- -max_total_time=60
      - working-directory: fuzz
        run: cargo fuzz run serde_roundtrip -- -max_total_time=60

  # ---------- MPFR full-union integration (Linux-only) ----------
  # ADR-0014 records the gating: 10⁴ inputs / (op × precision × mode)
  # in CI, 10⁶ locally under `PFLOAT_DEEP=1`. The lane is Linux-only
  # because `gmp-mpfr-sys` does not build on stock Windows toolchains;
  # `rug` (the safe wrapper) is gated `cfg(unix)` in `Cargo.toml`.
  #
  # The lane runs `--release` (ADR-0014 amendment, slice ci-green):
  # the kernels are bignum limb loops the optimiser collapses, so a
  # debug build runs an order of magnitude slower. The lane had been
  # silently hitting the 6-hour GitHub default timeout in debug since
  # the Phase 1f five-mode widening; `--release` restores it to the
  # minutes-scale the slice-6h note recorded, with no loss of input,
  # mode, or precision coverage. `timeout-minutes` makes a future
  # regression fail fast instead of burning the full 6-hour ceiling.
  #
  # The run carries no `--test` filter (ADR-0053). The earlier
  # `--test 'differential_*'` scoped to the differential lanes alone and
  # left the MPFR-backed oracle smoke tests running in no per-push job
  # at all: those tests also need `differential-mpfr` to compile, so the
  # feature matrix never builds them, and the glob did not match them.
  # With no filter, cargo runs every target whose `required-features`
  # are met (the differential lanes, the oracle smokes, and the
  # property/unit suite under the MPFR feature union) and silently skips
  # the rest, so the Arb- and ziv-instrumented-gated oracle targets stay
  # on their EC2 cross-check tier (ADR-0049) without erroring here.
  differential:
    name: MPFR full-union integration (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PFLOAT_NIGHTLY }}
      - uses: Swatinem/rust-cache@v2
      - name: Install MPFR + GMP
        run: sudo apt-get update && sudo apt-get install -y libmpfr-dev libgmp-dev
      - run: cargo test --release --features=differential-mpfr --verbose

  # ---------- Conformance evidence anti-rot gate ----------
  # README's `## Conformance evidence` section reports per-bucket
  # counts (Kani harnesses, differential lanes, fuzz targets, property
  # files) that drift as the project evolves. `scripts/conformance-
  # counts.sh --check` regenerates the block and diffs it against the
  # README; the job fails CI on any drift. Pure POSIX shell, no
  # Rust toolchain build, so it is the cheapest job in the matrix.
  conformance:
    name: conformance counts (per-bucket --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/conformance-counts.sh --check
      # Guard the full-feature-union list against silent drift: every
      # kernel feature in Cargo.toml must appear in the test-matrix and
      # clippy union, or a new kernel's tests would stop being gated
      # per-push the way the high-tier kernels once were. ADR-0053.
      - run: ./scripts/feature-union-check.sh
      # Keep the published rounding-status table (docs/rounding-status.md)
      # in lockstep with the oracle status records it is generated from.
      - run: ./scripts/rounding-status-table.sh --check
      # Keep the ADR index (docs/decisions/README.md) in lockstep with the
      # ADR files it lists, so it cannot rot behind the directory.
      - run: ./scripts/adr-index.sh --check
