name: Kani

# Runs only when manually triggered from the Actions tab. ADR-0012's
# status update (slice 6k) records why: every-push runs were costly
# (~10 minutes per run) without delivering completed proofs on the
# transcendental-heavy surface. The harnesses live in
# `src/verify/` and can be invoked locally with `cargo kani`; this
# workflow is the on-demand variant for evidence runs.

on:
  workflow_dispatch:
    inputs:
      features:
        description: 'Feature set passed to cargo kani'
        required: false
        default: 'std,fmt,big,fixed,ops,exp-log,trig,specials,agm'

env:
  CARGO_TERM_COLOR: always
  PFLOAT_NIGHTLY: nightly-2026-05-10

jobs:
  kani:
    name: kani harnesses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PFLOAT_NIGHTLY }}
      - uses: model-checking/kani-github-action@v1.1
        with:
          args: --features=${{ inputs.features }}

  # The Vec-free `Mag` round-up invariants (ADR-0078) discharge cleanly
  # under CBMC, unlike the BigFloat-backed ball surface (ADR-0062).
  kani-ball:
    name: kani harnesses (pfloat-ball Mag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PFLOAT_NIGHTLY }}
      - uses: model-checking/kani-github-action@v1.1
        with:
          working-directory: pfloat-ball
          args: --features=big

  # The Vec-free componentwise `Status` merge contract (ADR-0092). Run with
  # `--no-default-features`: the default profile pulls `pfloat/big`, which
  # activates pfloat's own `cfg(all(kani, feature = "big"))` verify suite that
  # needs math features pfloat-complex does not forward. The merge harness needs
  # only `pfloat::Status`, available in the bare build. The BigFloat-backed
  # elementary kernels are CBMC-hostile (ADR-0062) and verified by the
  # enumerated / acb differential lanes instead.
  kani-complex:
    name: kani harnesses (pfloat-complex Status merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PFLOAT_NIGHTLY }}
      - uses: model-checking/kani-github-action@v1.1
        with:
          working-directory: pfloat-complex
          args: --no-default-features
